<svg viewBox="0 0 945 715" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Diagram ERD bazy danych GymManagement">
<title>Schemat bazy danych GymManagement — 12 tabel</title>
<desc>Diagram zwiazkow encji: USERS jako centralna tabela kont laczy MEMBERS, TRAINERS, NOTIFICATIONS i PASSWORD_RESET_TOKENS; TRAINERS prowadza GYM_CLASSES z terminami CLASS_SESSIONS; MEMBERS rezerwuja (BOOKINGS), czekaja w kolejce (WAITLIST) i placa (PAYMENTS); EQUIPMENT i CONTACT_OPTIONS to tabele slownikowe.</desc>
<style>
  .tname{fill:#fff;font-weight:600;font-size:12.5px}
  .fname{fill:#334155;font-family:'Consolas','SF Mono',monospace;font-size:10.5px}
  .tag{fill:#64748b;font-family:'Consolas',monospace;font-weight:700;font-size:9px}
  .rel{stroke:#94a3b8;stroke-width:1.5;fill:none}
  .lg{fill:#475569;font-size:10.5px}
  .lgT{fill:#0f172a;font-weight:700;font-size:13px}
  .lgS{fill:#64748b;font-size:11px}
</style>
<defs>
  <marker id="crow" markerWidth="18" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M16,1 L2,8 M16,8 L2,8 M16,15 L2,8" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  </marker>
  <marker id="one" markerWidth="12" markerHeight="16" refX="6" refY="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M6,2 L6,14" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  </marker>
</defs>

<rect x="1" y="1" width="943" height="713" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- Legenda -->
<text x="22" y="40" class="lgT">Schemat bazy danych</text>
<text x="22" y="57" class="lgS">GymManagement &#183; 12 tabel</text>
<rect x="22" y="71" width="12" height="12" rx="2" fill="#4f46e5"/><text x="40" y="81" class="lg">Konta i tożsamość</text>
<rect x="22" y="91" width="12" height="12" rx="2" fill="#0d9488"/><text x="40" y="101" class="lg">Zajęcia</text>
<rect x="22" y="111" width="12" height="12" rx="2" fill="#d97706"/><text x="40" y="121" class="lg">Transakcje</text>
<rect x="22" y="131" width="12" height="12" rx="2" fill="#64748b"/><text x="40" y="141" class="lg">Słownikowe (bez relacji)</text>
<text x="22" y="168" class="lg">PK główny &#183; FK obcy &#183; UK unikalny</text>
<line x1="24" y1="182" x2="58" y2="182" class="rel" marker-end="url(#crow)"/><text x="66" y="186" class="lg">relacja 1 : N</text>
<line x1="24" y1="202" x2="58" y2="202" class="rel" marker-end="url(#one)"/><text x="66" y="206" class="lg">relacja 1 : 0..1</text>
<text x="22" y="232" class="lgS">USERS — tabela centralna</text>

