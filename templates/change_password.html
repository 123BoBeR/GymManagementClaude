{% extends "base.html" %}
{% block title %}Zmiana hasła — GymApp{% endblock %}

{% block content %}
<div class="ph">
  <h1><i class="bi bi-shield-lock-fill me-2" style="color:#e94560"></i>Zmiana hasła</h1>
  <p>Ustaw nowe hasło do swojego konta</p>
</div>

<div class="card" style="max-width:440px">
  <div class="card-body p-4">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Aktualne hasło</label>
        <input type="password" name="current_password" class="form-control" required placeholder="••••••••">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Nowe hasło</label>
        <input type="password" name="new_password" class="form-control" required placeholder="min. 6 znaków">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Powtórz nowe hasło</label>
        <input type="password" name="confirm_password" class="form-control" required placeholder="••••••••">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn"
                style="background:#e94560;color:#fff;border-radius:8px;font-weight:600">
          <i class="bi bi-check-lg me-1"></i> Zmień hasło
        </button>
        <a href="/" class="btn btn-outline-secondary" style="border-radius:8px">Anuluj</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
