<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Za dużo prób — GymApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      display: flex; align-items: center; justify-content: center;
      color: #fff; text-align: center; font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .box { max-width: 420px; padding: 2rem; }
    .code { font-size: 5rem; font-weight: 800; color: #e94560; line-height: 1; }
    .btn-back { background:#e94560; color:#fff; border:none; border-radius:8px;
                font-weight:600; padding:.6rem 1.4rem; text-decoration:none; }
    .btn-back:hover { background:#c73652; color:#fff; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code"><i class="bi bi-hourglass-split"></i></div>
    <h2 class="fw-bold mb-2">Za dużo prób</h2>
    <p class="mb-4" style="color:rgba(255,255,255,.7)">
      Przekroczono limit prób logowania. Odczekaj chwilę i spróbuj ponownie.
    </p>
    <a href="/login" class="btn-back"><i class="bi bi-arrow-left me-1"></i> Wróć do logowania</a>
  </div>
</body>
</html>
