<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie — GymApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      width: 380px;
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .login-logo { color: #e94560; font-size: 2.5rem; }
    .login-title { font-size: 1.5rem; font-weight: 700; color: #1e293b; }
    .login-sub   { color: #64748b; font-size: .88rem; }
    .form-control { border-radius: 8px; font-size: .9rem; }
    .form-control:focus { box-shadow: 0 0 0 3px rgba(233,69,96,.15); border-color: #e94560; }
    .btn-login {
      background: #e94560; color: #fff; border: none;
      border-radius: 8px; font-weight: 600; padding: .6rem;
      transition: background .2s;
    }
    .btn-login:hover { background: #c73652; color: #fff; }
    .hint-table td { font-size: .78rem; padding: .15rem .4rem; }
    .hint-table td:first-child { color: #64748b; }
    .hint-table td:last-child { font-family: monospace; color: #1e293b; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-logo"><i class="bi bi-lightning-charge-fill"></i></div>
      <div class="login-title">GymApp</div>
      <div class="login-sub">System zarządzania siłownią</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2 mb-3" style="font-size:.87rem">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.88rem">Nazwa użytkownika</label>
        <input type="text" name="username" class="form-control" placeholder="login" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold" style="font-size:.88rem">Hasło</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Zaloguj się
      </button>
    </form>

    <hr class="my-4">
    <p class="text-muted mb-2" style="font-size:.78rem; text-align:center">Konta testowe</p>
    <table class="hint-table w-100">
      <tr><td>Admin</td>      <td>admin</td>            <td>admin123</td></tr>
      <tr><td>Trener</td>     <td>jan.kowalski</td>     <td>trener123</td></tr>
      <tr><td>Klient</td>     <td>tomasz.krol</td>      <td>klient123</td></tr>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
