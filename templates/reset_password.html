<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowe hasło — GymApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      width: 400px; background: #fff; border-radius: 16px;
      padding: 2.4rem 2rem; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .login-logo { color: #e94560; font-size: 2.2rem; }
    .login-title { font-size: 1.35rem; font-weight: 700; color: #1e293b; }
    .login-sub   { color: #64748b; font-size: .86rem; }
    .form-control { border-radius: 8px; font-size: .9rem; }
    .form-control:focus { box-shadow: 0 0 0 3px rgba(233,69,96,.15); border-color: #e94560; }
    .btn-login {
      background: #e94560; color: #fff; border: none;
      border-radius: 8px; font-weight: 600; padding: .6rem; transition: background .2s;
    }
    .btn-login:hover { background: #c73652; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-logo"><i class="bi bi-key"></i></div>
      <div class="login-title">Ustaw nowe hasło</div>
      <div class="login-sub">Wpisz nowe hasło dwukrotnie</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2 mb-3" style="font-size:.87rem">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-2">
        <label class="form-label fw-semibold" style="font-size:.88rem">Nowe hasło <span class="text-muted fw-normal">(min. 6 znaków)</span></label>
        <input type="password" name="new_password" class="form-control" placeholder="••••••••" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.88rem">Powtórz hasło</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-check2-circle me-1"></i> Zmień hasło
      </button>
    </form>

    <p class="text-center text-muted mt-3 mb-0" style="font-size:.84rem">
      <a href="{{ url_for('auth.login') }}" style="color:#e94560;text-decoration:none;font-weight:600">← Wróć do logowania</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
